# One Linux VPS behind Cloudflare (docs/deploy/staging.md, §0): adds the TLS proxy in front of the
# site's server. Use it with compose.yaml and compose.staging.yaml; infra/deploy-staging.sh does.
#
# Cloudflare (proxied, SSL/TLS mode Full (strict)) -> :443 `tls` (Caddy, Cloudflare Origin CA
# certificate in infra/certs/) -> `web` (the site's server) -> `api`. Nothing else of the stack is
# published: `web` stays on loopback (ARABLYZER_BIND), and the data, scan and isolated networks have
# no way in.
services:
  tls:
    image: caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    pull_policy: if_not_present
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    # Docker publishes 443 and hands the container 8443: no capability to bind a low port.
    ports: ['${ARABLYZER_TLS_BIND:-0.0.0.0}:443:8443']
    volumes:
      - ./tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    tmpfs: ['/data:uid=65534,gid=65534', '/config:uid=65534,gid=65534']
    user: '65534:65534'
    environment:
      ARABLYZER_HOST: ${ARABLYZER_HOST:?the hostname of ARABLYZER_SITE, e.g. staging.arablyzer.com}
      # https://www.cloudflare.com/ips-v4 and /ips-v6, as of 2026-10; compare before the first start.
      ARABLYZER_CLOUDFLARE_RANGES: ${ARABLYZER_CLOUDFLARE_RANGES:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-check-certificate',
          '-q',
          '-O',
          '/dev/null',
          '--header',
          'Host: ${ARABLYZER_HOST}',
          'https://127.0.0.1:8443/',
        ]
      interval: 10s
      retries: 5
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 128
