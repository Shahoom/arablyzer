# Arablyzer on one host (M2.1 plan §5b): the site's server, the API, the worker, the scanner with
# its browsers, the egress proxy, Valkey and PostgreSQL, within the memory budget of BUILD-PLAN
# §18.3.1, and with CPU and process caps so the browsers never slow the host's other services.
# The caps are a start, not a measurement: tune them to the host.
#
#   cp infra/.env.example infra/.env        # then fill it in
#   docker compose -f infra/compose.yaml up --build
#
# Networks, so that each part reaches only what it needs:
#   edge      the site's server, the API (which resolves names for its first check) and the egress
#             proxy: the one network with a way out
#   data      internal: the API and the worker, and Valkey and PostgreSQL
#   scan      internal: the worker and the scanner
#   isolated  internal: the scanner and the egress proxy; the browsers' only way out
# The internal networks give the host no address on their bridges: with one, a container on them
# reaches every service the host runs, around the egress proxy (M2.1d review). Docker ignores a
# network option it does not know, so the stack's test checks it on the Docker that runs it:
# `pnpm test:stack` (README, "The stack").
name: arablyzer

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Docker keeps what a service writes; this much, no more.
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

x-internal: &internal
  internal: true
  driver_opts:
    # No address for the host on the bridge. Gateway mode `isolated` (Docker Engine 28 and
    # later) is Docker's own way; inhibit_ipv4 does the same on an Engine that ignores the first.
    com.docker.network.bridge.gateway_mode_ipv4: isolated
    com.docker.network.bridge.inhibit_ipv4: 'true'

services:
  web:
    <<: *hardened
    build:
      context: ..
      target: web
      args:
        ARABLYZER_SITE: ${ARABLYZER_SITE:?}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:?}
    # For the host's own proxy, which terminates TLS in front, alone: on loopback unless
    # ARABLYZER_BIND says otherwise. Caddy binds a port above 1024, so it needs no capability.
    ports: ['${ARABLYZER_BIND:-127.0.0.1}:${ARABLYZER_PORT:-8080}:8080']
    tmpfs: ['/data:uid=65534,gid=65534', '/config:uid=65534,gid=65534']
    environment:
      # Whose X-Forwarded-For the site's server believes: the host's proxy (infra/Caddyfile).
      ARABLYZER_TRUSTED_PROXIES: ${ARABLYZER_TRUSTED_PROXIES:-private_ranges}
      # What it shows the API with every request, so that the API believes the address it forwards.
      ARABLYZER_PROXY_SECRET: ${ARABLYZER_PROXY_SECRET:?}
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      retries: 5
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 128

  api:
    <<: *hardened
    build: { context: .., target: api }
    init: true
    tmpfs: [/tmp]
    environment:
      VALKEY_URL: redis://arablyzer:${VALKEY_PASSWORD:?}@valkey:6379
      # The role that reads, writes and deletes scans and changes nothing else (packages/store): never the
      # bootstrap user's, whose password only `migrate` holds.
      DATABASE_URL: postgres://arablyzer_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/arablyzer
      ARABLYZER_SITE: ${ARABLYZER_SITE:?}
      # Search Console, connected from a report: both, or neither (the button is then hidden).
      ARABLYZER_GSC_CLIENT_ID: ${ARABLYZER_GSC_CLIENT_ID:-}
      ARABLYZER_GSC_CLIENT_SECRET: ${ARABLYZER_GSC_CLIENT_SECRET:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?}
      ARABLYZER_LIMIT_SECRET: ${ARABLYZER_LIMIT_SECRET:?}
      ARABLYZER_LIMIT_CONNECTION_SCANS: ${ARABLYZER_LIMIT_CONNECTION_SCANS:?}
      ARABLYZER_LIMIT_CONNECTION_SECONDS: ${ARABLYZER_LIMIT_CONNECTION_SECONDS:?}
      ARABLYZER_LIMIT_NETWORK_SCANS: ${ARABLYZER_LIMIT_NETWORK_SCANS:?}
      ARABLYZER_LIMIT_NETWORK_SECONDS: ${ARABLYZER_LIMIT_NETWORK_SECONDS:?}
      ARABLYZER_LIMIT_ATTEMPT_REQUESTS: ${ARABLYZER_LIMIT_ATTEMPT_REQUESTS:?}
      ARABLYZER_LIMIT_ATTEMPT_SECONDS: ${ARABLYZER_LIMIT_ATTEMPT_SECONDS:?}
      ARABLYZER_LIMIT_HOST_SCANS: ${ARABLYZER_LIMIT_HOST_SCANS:?}
      ARABLYZER_LIMIT_HOST_SECONDS: ${ARABLYZER_LIMIT_HOST_SECONDS:?}
      ARABLYZER_LIMIT_QUEUE: ${ARABLYZER_LIMIT_QUEUE:?}
      ARABLYZER_LIMIT_INFLIGHT: ${ARABLYZER_LIMIT_INFLIGHT:?}
      # The site's server puts the visitor's address last in X-Forwarded-For (infra/Caddyfile),
      # and shows this secret with it: without the secret, the API believes no address.
      ARABLYZER_TRUST_PROXY: proxy
      ARABLYZER_PROXY_SECRET: ${ARABLYZER_PROXY_SECRET:?}
      ARABLYZER_EGRESS_PROXY: http://egress:4750
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:?}
    networks: [edge, data]
    depends_on:
      valkey: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      egress: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8787, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 256

  # The database's own step, once, before the API and the worker (packages/store/src/migrate.ts):
  # it makes the two roles and the tables, and sets the application role's password. It alone
  # holds the bootstrap user's password (a superuser's), and it stops when it is done: the API
  # and the worker connect as `arablyzer_app`, which can read, write and delete the scans and nothing else.
  migrate:
    <<: *hardened
    restart: 'no'
    build: { context: .., target: api }
    init: true
    tmpfs: [/tmp]
    command: [node, --import, tsx, packages/store/src/migrate.ts]
    environment:
      DATABASE_URL: postgres://arablyzer:${POSTGRES_PASSWORD:?}@postgres:5432/arablyzer
      ARABLYZER_APP_DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

  worker:
    <<: *hardened
    build: { context: .., target: worker }
    init: true
    tmpfs: [/tmp]
    environment:
      VALKEY_URL: redis://arablyzer:${VALKEY_PASSWORD:?}@valkey:6379
      DATABASE_URL: postgres://arablyzer_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/arablyzer
      ARABLYZER_SCANNER_URL: http://scanner:8788
      ARABLYZER_SCANNER_TOKEN: ${ARABLYZER_SCANNER_TOKEN:?}
      # The site a scan ends at, after its redirects, counts against the per-host limit: the API's
      # own numbers.
      ARABLYZER_LIMIT_HOST_SCANS: ${ARABLYZER_LIMIT_HOST_SCANS:?}
      ARABLYZER_LIMIT_HOST_SECONDS: ${ARABLYZER_LIMIT_HOST_SECONDS:?}
      # Days reports are kept: the owner's number, and unset (empty) keeps them all.
      ARABLYZER_REPORT_RETENTION_DAYS: ${ARABLYZER_REPORT_RETENTION_DAYS:-}
    networks: [data, scan]
    depends_on:
      api: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      scanner: { condition: service_healthy }
    # The scan running finishes before the worker stops: longer than the longest it waits for
    # the scanner (SCANNER_TIMEOUT_MS, 240 s).
    stop_grace_period: 270s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 256

  scanner:
    <<: *hardened
    build: { context: .., target: scanner }
    # Ends its process after a scan that started a browser or Lighthouse (M3: they run without a
    # sandbox of their own, beside the worker's token and the CrUX key); `restart` above starts a
    # clean one, with an empty tmpfs and none of the last page's processes, and the worker waits for
    # it (apps/worker). A scan that started none leaves the process as it is.
    # Reaps the browsers' processes whose parent has gone.
    init: true
    # The browsers' profiles and caches, in memory; Firefox needs a home it can write to.
    tmpfs: [/tmp, '/home/arablyzer:uid=10001,gid=10001,mode=0700']
    shm_size: 512m
    environment:
      ARABLYZER_SCANNER_TOKEN: ${ARABLYZER_SCANNER_TOKEN:?}
      ARABLYZER_EGRESS_PROXY: http://egress:4750
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:?}
      ARABLYZER_ENGINES: ${ARABLYZER_ENGINES:-chromium,firefox,webkit}
      ARABLYZER_CRUX_KEY: ${ARABLYZER_CRUX_KEY:-}
      ARABLYZER_SAFE_BROWSING_KEY: ${ARABLYZER_SAFE_BROWSING_KEY:-}
      ARABLYZER_KG_KEY: ${ARABLYZER_KG_KEY:-}
      ARABLYZER_OPR_KEY: ${ARABLYZER_OPR_KEY:-}
      ARABLYZER_SUGGEST: ${ARABLYZER_SUGGEST:-}
      # The scanner resolves no name itself, so the TXT lookups of its DNS rules (SPF, DMARC) are
      # DNS over HTTPS, through the egress proxy like all its traffic; empty: Cloudflare's.
      ARABLYZER_DOH_URL: ${ARABLYZER_DOH_URL:-}
      # The network sees the egress proxy alone, so WebKit may run (plan §13).
      ARABLYZER_NETWORK_ISOLATED: '1'
      # No shader cache kept from one scan to the next.
      MESA_SHADER_CACHE_DISABLE: 'true'
    networks: [scan, isolated]
    depends_on:
      egress: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      retries: 10
    stop_grace_period: 270s
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 2
    # The browsers' threads count too.
    pids_limit: 1024

  egress:
    <<: *hardened
    build: { context: egress }
    environment:
      # The server's own public address, refused like every private range (§18.3.1): required.
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:?}
    networks: [edge, isolated]
    healthcheck:
      test: ['CMD', '/egress', 'check']
      interval: 10s
      retries: 5
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 128

  valkey:
    <<: *hardened
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # Its own user from the start: dropping to it from root needs capabilities it does not have.
    user: valkey
    # Its settings are written to memory as it starts, from VALKEY_PASSWORD, and the server reads
    # them from there: a password on its command line is shown by the host's `ps` to every user
    # of the host. The file holds a SHA-256 of it, not the password. The default user is off, so
    # nothing connects without a name and a password; `arablyzer`, whom the API and the worker
    # connect as, has the keys the queue, the events and the limits use, and every command but the
    # administrative and dangerous ones (FLUSHALL, KEYS, CONFIG, DEBUG, SHUTDOWN, REPLICAOF ...),
    # which BullMQ and the stores do not use (measured: ACL LOG stays empty through a scan).
    # The queue, the events and the limits are all it keeps: nothing to save across a restart, and
    # nothing evicted to make room, which BullMQ needs.
    tmpfs: [/tmp]
    command:
      - sh
      - -c
      - |
        set -eu
        [ "$${#VALKEY_PASSWORD}" -ge 32 ] || { echo 'VALKEY_PASSWORD must be 32 characters or more' >&2; exit 1; }
        umask 077
        hash=$$(printf %s "$$VALKEY_PASSWORD" | sha256sum | cut -d' ' -f1)
        cat > /tmp/valkey.conf <<EOF
        user default off
        user arablyzer on #$$hash ~arablyzer:* ~bull:arablyzer-scans:* &* +@all -@admin -@dangerous +info
        save ""
        appendonly no
        maxmemory 100mb
        maxmemory-policy noeviction
        EOF
        exec valkey-server /tmp/valkey.conf
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli --user arablyzer --no-auth-warning ping | grep -q PONG
      interval: 5s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128

  postgres:
    <<: *hardened
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # Its own user from the start, like Valkey; its data on the volume, its socket in memory.
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    environment:
      # The bootstrap user, a superuser, which only `migrate` connects as (and the host's own
      # psql, for the owner): the services connect as arablyzer_app.
      POSTGRES_USER: arablyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: arablyzer
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'arablyzer', '-d', 'arablyzer']
      interval: 5s
      retries: 10
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256

networks:
  edge: {}
  data: *internal
  scan: *internal
  isolated: *internal

volumes:
  postgres: {}
