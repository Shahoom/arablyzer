# Arablyzer on one host (M2.1 plan §5b): the site's server, the API, the worker, the scanner with
# its browsers, the egress proxy, Valkey and PostgreSQL, within the memory budget of BUILD-PLAN
# §18.3.1.
#
#   cp infra/.env.example infra/.env        # then fill it in
#   docker compose -f infra/compose.yaml up --build
#
# Networks, so that each part reaches only what it needs:
#   edge      the site's server, the API (which resolves names for its first check) and the egress
#             proxy: the one network with a way out
#   data      internal: the API and the worker, and Valkey and PostgreSQL
#   scan      internal: the worker and the scanner
#   isolated  internal: the scanner and the egress proxy; the browsers' only way out
name: arablyzer

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *hardened
    build:
      context: ..
      target: web
      args:
        ARABLYZER_SITE: ${ARABLYZER_SITE:?}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:?}
    # Caddy binds a port above 1024, so it needs no capability.
    ports: ['${ARABLYZER_PORT:-8080}:8080']
    tmpfs: [/data, /config]
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      retries: 5
    mem_limit: 64m

  api:
    <<: *hardened
    build: { context: .., target: api }
    tmpfs: [/tmp]
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379
      DATABASE_URL: postgres://arablyzer:${POSTGRES_PASSWORD:?}@postgres:5432/arablyzer
      ARABLYZER_SITE: ${ARABLYZER_SITE:?}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?}
      ARABLYZER_LIMIT_SECRET: ${ARABLYZER_LIMIT_SECRET:?}
      ARABLYZER_LIMIT_CONNECTION_SCANS: ${ARABLYZER_LIMIT_CONNECTION_SCANS:?}
      ARABLYZER_LIMIT_CONNECTION_SECONDS: ${ARABLYZER_LIMIT_CONNECTION_SECONDS:?}
      ARABLYZER_LIMIT_HOST_SCANS: ${ARABLYZER_LIMIT_HOST_SCANS:?}
      ARABLYZER_LIMIT_HOST_SECONDS: ${ARABLYZER_LIMIT_HOST_SECONDS:?}
      ARABLYZER_LIMIT_QUEUE: ${ARABLYZER_LIMIT_QUEUE:?}
      # The site's server puts the visitor's address last in X-Forwarded-For (infra/Caddyfile).
      ARABLYZER_TRUST_PROXY: proxy
      ARABLYZER_EGRESS_PROXY: http://egress:4750
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:-}
    networks: [edge, data]
    depends_on:
      valkey: { condition: service_healthy }
      postgres: { condition: service_healthy }
      egress: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(8787, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 10s
      retries: 10
    mem_limit: 256m

  worker:
    <<: *hardened
    build: { context: .., target: worker }
    tmpfs: [/tmp]
    environment:
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379
      DATABASE_URL: postgres://arablyzer:${POSTGRES_PASSWORD:?}@postgres:5432/arablyzer
      ARABLYZER_SCANNER_URL: http://scanner:8788
      ARABLYZER_SCANNER_TOKEN: ${ARABLYZER_SCANNER_TOKEN:?}
    networks: [data, scan]
    depends_on:
      api: { condition: service_healthy }
      scanner: { condition: service_healthy }
    # The scan running finishes before the worker stops: longer than a scan's budget (120 s).
    stop_grace_period: 180s
    mem_limit: 256m

  scanner:
    <<: *hardened
    build: { context: .., target: scanner }
    # The browsers' profiles and caches, in memory; Firefox needs a home it can write to.
    tmpfs: [/tmp, '/home/arablyzer:uid=10001,gid=10001,mode=0700']
    shm_size: 512m
    environment:
      ARABLYZER_SCANNER_TOKEN: ${ARABLYZER_SCANNER_TOKEN:?}
      ARABLYZER_EGRESS_PROXY: http://egress:4750
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:-}
      ARABLYZER_ENGINES: ${ARABLYZER_ENGINES:-chromium,firefox,webkit}
      ARABLYZER_CRUX_KEY: ${ARABLYZER_CRUX_KEY:-}
    networks: [scan, isolated]
    depends_on:
      egress: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8788/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      retries: 10
    stop_grace_period: 180s
    mem_limit: 1200m

  egress:
    <<: *hardened
    build: { context: egress }
    environment:
      # The server's own public address, refused like every private range (§18.3.1).
      ARABLYZER_DENY_CIDRS: ${ARABLYZER_DENY_CIDRS:-}
    networks: [edge, isolated]
    healthcheck:
      test: ['CMD', '/egress', 'check']
      interval: 10s
      retries: 5
    mem_limit: 64m

  valkey:
    <<: *hardened
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    # Its own user from the start: dropping to it from root needs capabilities it does not have.
    user: valkey
    # The queue, the events and the limits: nothing to keep across a restart, and nothing
    # evicted to make room, which BullMQ needs.
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - noeviction
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      retries: 10
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: arablyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: arablyzer
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'arablyzer', '-d', 'arablyzer']
      interval: 5s
      retries: 10
    mem_limit: 512m

networks:
  edge: {}
  data: { internal: true }
  scan: { internal: true }
  isolated: { internal: true }

volumes:
  postgres: {}
