name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: SSRF tests
        run: pnpm test:ssrf
      - name: Unit and rule tests
        run: pnpm test:unit
      - name: E2E (built CLI over every fixture site)
        run: pnpm test:e2e
      - name: SEO self-audit (every tool page and the report template)
        run: pnpm seo:audit
      - name: Report schema drift
        run: pnpm schema:check

  arabic-copy:
    # Design decision 7: a rule stays red until the owner has read its Arabic copy and set
    # `reviewed: true` in packages/rules/src/rules/<id>/copy.ar.md.
    name: Arabic copy reviewed by the owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check review flags
        run: pnpm copy:review
