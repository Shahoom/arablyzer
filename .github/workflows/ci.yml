name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: SSRF tests
        run: pnpm test:ssrf
      - name: Unit and rule tests
        run: pnpm test:unit
      - name: E2E (built CLI over every fixture site)
        run: pnpm test:e2e
      - name: SEO self-audit (every tool page and the report template)
        run: pnpm seo:audit
      - name: Site build and self-audit (every page Astro builds, M2.1)
        run: pnpm site:build && pnpm site:audit
      - name: Report schema drift
        run: pnpm schema:check

  browsers:
    # M1.1: the browser SSRF suite and the rendered-facts tests, in every engine (Phase 1 design
    # §6). A missing engine fails the run instead of being skipped.
    name: Browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache the browsers of this Playwright version
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browsers and their system libraries
        run: pnpm --filter @arablyzer/browser exec playwright-core install --with-deps chromium firefox webkit
      - name: Browser SSRF suite, rendered facts, and the site scanning itself
        run: pnpm test:browser
        env:
          ARABLYZER_REQUIRE_ENGINES: chromium,firefox,webkit
      - name: Lighthouse on the site (M2.1 plan §3)
        run: |
          CHROME_PATH="$(find ~/.cache/ms-playwright -type f -name chrome -path '*/chromium-*' | head -1)"
          export CHROME_PATH
          pnpm --filter @arablyzer/web run lighthouse --runs 3 --min-mobile 95 --min-desktop 100 --out lighthouse.json
      - name: Keep the Lighthouse scores
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: lighthouse.json
          if-no-files-found: ignore
          overwrite: true

  services:
    # M2.1b: the stores, the queue and the whole scan path on the Valkey and PostgreSQL that
    # Compose runs, as service containers. A run without them fails instead of skipping.
    name: Stores on Valkey and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arablyzer
          POSTGRES_PASSWORD: arablyzer
          POSTGRES_DB: arablyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arablyzer" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Stores, queue and scan path
        run: pnpm test:services
        env:
          ARABLYZER_TEST_VALKEY_URL: redis://127.0.0.1:6379
          ARABLYZER_TEST_DATABASE_URL: postgres://arablyzer:arablyzer@127.0.0.1:5432/arablyzer
          ARABLYZER_REQUIRE_SERVICES: '1'

  image:
    # M1.3c: the scanner image (Phase 1 design §6, decision 9), built here and never pushed, and
    # the golden reports, which come from it alone (BUILD-PLAN §16.3). Its network is loopback
    # only (--network none), so WebKit renders too. A report that differs is kept as an artifact.
    name: Scanner image and golden reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: |
          docker build --tag arablyzer:ci .
          docker image ls arablyzer:ci
          # The image's own entry point, the CLI, as a user runs it.
          docker run --rm --network none arablyzer:ci --version
      - name: Golden reports
        run: |
          mkdir -p golden-actual && chmod 777 golden-actual
          docker run --rm --network none \
            -e ARABLYZER_NETWORK_ISOLATED=1 -e ARABLYZER_GOLDEN_OUT=/out \
            -v "$PWD/golden-actual:/out" \
            --entrypoint pnpm arablyzer:ci test:golden
      - name: Keep the reports that differ
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-actual
          path: golden-actual
          if-no-files-found: ignore
          # A re-run of the job replaces what the run before it kept.
          overwrite: true

  stack:
    # M2.1d: the stack as Compose runs it (M2.1 plan §5b), with a golden site served inside it,
    # scanned from the API to its report; the networks each part reaches; the egress proxy's
    # refusals. Cloudflare's test Turnstile keys, and secrets made for the run.
    name: The stack, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The stack's settings, for this run
        run: |
          secret() { openssl rand -hex 24; }
          {
            # The host Turnstile's test keys answer with.
            echo ARABLYZER_SITE=https://example.com
            echo ARABLYZER_PORT=8080
            echo PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
            echo TURNSTILE_SECRET=1x0000000000000000000000000000000AA
            echo ARABLYZER_LIMIT_CONNECTION_SCANS=10
            echo ARABLYZER_LIMIT_CONNECTION_SECONDS=3600
            echo ARABLYZER_LIMIT_HOST_SCANS=20
            echo ARABLYZER_LIMIT_HOST_SECONDS=3600
            echo ARABLYZER_LIMIT_QUEUE=50
            echo "ARABLYZER_LIMIT_SECRET=$(secret)"
            echo "ARABLYZER_SCANNER_TOKEN=$(secret)"
            echo "VALKEY_PASSWORD=$(secret)"
            echo "POSTGRES_PASSWORD=$(secret)"
          } > infra/.env
      - name: Build and start the stack
        run: docker compose -f infra/compose.yaml -f infra/compose.e2e.yaml up --detach --build --wait --wait-timeout 900
      - name: The stack, end to end
        run: pnpm test:stack
      - name: The stack's logs
        if: failure()
        run: docker compose -f infra/compose.yaml -f infra/compose.e2e.yaml logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose.yaml -f infra/compose.e2e.yaml down --volumes

  arabic-copy:
    # Design decision 7: a rule or tool stays red until the owner has read its Arabic copy and
    # set `reviewed: true` in packages/{rules/src/rules/<id>,tools/src/tools/<slug>}/copy.ar.md.
    name: Arabic copy reviewed by the owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check review flags
        run: pnpm copy:review
