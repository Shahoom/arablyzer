<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إتمام الطلب | متجر الواحة</title>
  <meta name="description" content="إتمام الطلب | متجر الواحة" /><meta property="og:title" content="إتمام الطلب | متجر الواحة" /><meta property="og:description" content="إتمام الطلب | متجر الواحة" /><meta property="og:image" content="https://www.example.com/og.png" /></head>
  <body>
    <main>
      <h1>إتمام الطلب</h1>
      <form action="/checkout" method="post">
        <label for="name">الاسم الكامل</label>
        <input id="name" name="full_name" autocomplete="name" pattern="[\p{L}\p{M} '\-]{2,60}" />
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <label for="phone">رقم الجوال</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" dir="ltr" />
        <label for="city">المدينة</label>
        <input id="city" name="city" autocomplete="address-level2" pattern="[A-Za-z ]{2,40}" />
        <label for="street">العنوان</label>
        <input id="street" name="street" autocomplete="street-address" pattern="[A-Za-z0-9 ,.\-]{5,80}" />
        <button>تأكيد الطلب</button>
      </form>
    </main>
  </body>
</html>
