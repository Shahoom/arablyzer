    <title>عن متجر العطور</title>

  <body>
    <main>
      <h1>من نحن</h1>
      <p>متجر صغير في مسقط يبيع العطور العربية والبخور ودهن العود، ويوصل الطلبات إلى جميع مناطق السلطنة.</p>
      <p>نختار عطورنا من مصانع محلية، ونكتب وصف كل منتج بالعربية حتى يعرف الزبون ما يشتريه قبل أن يطلبه.</p>
    </main>
  </body>
