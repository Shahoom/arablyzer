    <title>درباره فروشگاه عطر</title>

  <body>
    <main>
      <h1>درباره ما</h1>
      <p>فروشگاه کوچکی در مسقط که عطرهای عربی و عود می‌فروشد و سفارش‌ها را به همه مناطق عمان می‌فرستد.</p>
      <p>عطرها را از کارگاه‌های محلی انتخاب می‌کنیم و توضیح هر محصول را به زبان خودِ خریدار می‌نویسیم.</p>
    </main>
