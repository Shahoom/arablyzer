<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>متجر العطور</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      main {
        padding: 16px;
      }
      /*
       * A closed side menu, hidden past the left edge as in a left-to-right design. A
       * right-to-left page scrolls towards the left, so the menu can be scrolled into view.
       */
      .drawer {
        position: absolute;
        top: 0;
        left: -280px;
        width: 260px;
      }
    </style>
  </head>
  <body>
    <nav class="drawer" aria-label="القائمة">
      <a href="/">الرئيسية</a>
      <a href="/offers">العروض</a>
    </nav>
    <main>
      <h1>متجر العطور</h1>
      <p>عطور شرقية ودهن عود أصلي، مع توصيل داخل المدينة.</p>
    </main>
  </body>
</html>
