<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عنوان التوصيل | متجر الواحة</title>
    <meta name="description" content="أدخل عنوان التوصيل ورقم الجوال لإتمام الطلب." />
    <meta property="og:title" content="عنوان التوصيل" />
    <meta property="og:description" content="أدخل عنوان التوصيل ورقم الجوال لإتمام الطلب." />
    <meta property="og:image" content="https://www.example.com/og.png" />
  </head>
  <body>
    <main>
      <h1>عنوان التوصيل</h1>
      <form action="/checkout" method="post">
        <label for="phone">رقم الجوال</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" pattern="(\+968)?[0-9٠-٩]{8}" placeholder="9xxxxxxx" required />
        <label for="postal">الرمز البريدي</label>
        <input id="postal" name="postal" autocomplete="postal-code" inputmode="numeric" />
        <label for="otp">رمز التحقق</label>
        <input id="otp" name="otp" autocomplete="one-time-code" pattern="\p{Nd}{6}" />
        <label for="coupon">كود الخصم</label>
        <input id="coupon" name="coupon" pattern="[A-Z0-9]{6}" dir="ltr" />
        <button>متابعة الدفع</button>
      </form>
    </main>
  </body>
</html>
