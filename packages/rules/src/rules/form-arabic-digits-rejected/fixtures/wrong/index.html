<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>عنوان التوصيل | متجر الواحة</title>
    <meta name="description" content="أدخل عنوان التوصيل ورقم الجوال لإتمام الطلب." />
    <meta property="og:title" content="عنوان التوصيل" />

  <body>
    <main>
      <h1>عنوان التوصيل</h1>
      <form action="/checkout" method="post">
        <label for="phone">رقم الجوال</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" pattern="[0-9]{8}" placeholder="9xxxxxxx" required />
        <label for="area">المنطقة</label>
        <input id="area" name="area" />
        <button>متابعة الدفع</button>
      </form>
    </main>
  </body>
