<!doctype html>
<html lang="ar" dir="rtl">
  <head>

  <body>
    <main>
      <h1>عنوان التوصيل</h1>
      <form action="/checkout" method="post">

        <input id="phone" name="phone" type="tel" dir="ltr" autocomplete="tel" />
        <label for="whatsapp">رقم واتساب</label>
        <input id="whatsapp" name="whatsapp" inputmode="tel" dir="auto" />

      </form>
    </main>
  </body>
