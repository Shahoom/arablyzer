<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إتمام الطلب | متجر الواحة</title>
    <meta name="description" content="أدخل بيانات التوصيل لإتمام طلبك من متجر الواحة." />
    <meta property="og:title" content="إتمام الطلب | متجر الواحة" />
    <meta property="og:description" content="أدخل بيانات التوصيل لإتمام طلبك من متجر الواحة." />
    <meta property="og:image" content="https://www.example.com/og.png" />
  </head>
  <body>
    <main>
      <h1>إتمام الطلب</h1>
      <form action="/checkout" method="post">
        <label for="name">الاسم الكامل</label>
        <input id="name" name="full_name" autocomplete="name" pattern="[A-Za-z ]{3,40}" required />
        <label for="mobile">رقم الجوال</label>
        <input
          id="mobile"
          name="mobile"
          inputmode="tel"
          autocomplete="tel"
          pattern="[0-9]{8}"
          required
        />
        <p>البريد الإلكتروني</p>
        <input id="email" name="email" type="email" />
        <button>متابعة الدفع</button>
      </form>
    </main>
  </body>
</html>
