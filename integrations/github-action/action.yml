name: Arablyzer
description: Scan a page with Arablyzer (Arabic rendering, RTL, SEO, accessibility, security, speed), get a job summary and SARIF for code scanning.
author: Arablyzer
branding:
  icon: check-circle
  color: blue

inputs:
  url:
    description: The page to scan (http or https).
    required: false
  urls:
    description: Several pages, one per line or separated by commas (at most 10). Used together with `url`.
    required: false
  api_key:
    description: An Arablyzer API key (arb_…) from your account page. Keep it in a repository secret.
    required: true
  api_url:
    description: Where Arablyzer is. Change it only if you run your own.
    required: false
    default: https://arablyzer.com
  fail_on:
    description: Fail the step when the scan has findings of this severity or worse. critical, serious or none.
    required: false
    default: none
  wait:
    description: Wait for the scan, then write the summary and the SARIF files. With false the scan is only started.
    required: false
    default: 'true'
  lang:
    description: Language of the job summary and the SARIF messages, ar or en.
    required: false
    default: en
  sarif_dir:
    description: Folder in the workspace for the SARIF files (one per page), to hand to github/codeql-action/upload-sarif.
    required: false
    default: arablyzer-sarif
  timeout_seconds:
    description: How long to wait for each scan, 30 to 1800.
    required: false
    default: '300'
  max_issues:
    description: How many problems the job summary lists per page, 1 to 50.
    required: false
    default: '10'

outputs:
  score:
    description: The lowest overall score among the pages scanned (empty when none has one).
  scores:
    description: JSON object of page address to score.
  findings:
    description: JSON object of finding counts by severity, over all pages.
  report_urls:
    description: JSON array of the report pages.
  sarif_dir:
    description: The folder the SARIF files were written to (empty when none was).
  result:
    description: pass, fail (findings at fail_on), error (a page could not be scanned) or started (wait is false).

runs:
  using: node24
  main: dist/index.mjs
