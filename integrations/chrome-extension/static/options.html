<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arablyzer</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main class="sheet">
      <header class="top">
        <span class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" width="100%" height="100%">
              <path
                d="M24 10.5H8.5M24 16H12.5M24 21.5H16.5"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="name">Arablyzer</span>
        </span>
      </header>
      <h1 id="title" class="page-title"></h1>
      <p id="lead" class="note"></p>
      <form id="form" class="fields" autocomplete="off">
        <div class="field">
          <label id="key-label" for="key"></label>
          <input
            id="key"
            name="key"
            type="password"
            dir="ltr"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            aria-describedby="key-help"
          />
          <p id="key-help" class="help"></p>
        </div>
        <div class="field">
          <label id="host-label" for="host"></label>
          <input
            id="host"
            name="host"
            type="url"
            dir="ltr"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="host-help"
          />
          <p id="host-help" class="help"></p>
        </div>
        <div class="field">
          <label id="lang-label" for="lang"></label>
          <select id="lang" name="lang">
            <option id="lang-auto" value="auto"></option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="actions">
          <button id="save" type="submit" class="btn primary"></button>
          <button id="test" type="button" class="btn quiet"></button>
          <button id="remove" type="button" class="btn quiet"></button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
      <p id="privacy" class="note small"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
